<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ovos - Gestão de Entregas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <header class="bg-amber-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🥚 Controle de Ovos & Entregas</h1>
        </div>
    </header>

    <nav class="bg-white shadow-sm border-b">
        <div class="container mx-auto px-4 flex gap-6">
            <button onclick="mudarAba('clientes')" id="btn-clientes" class="py-3 font-medium text-amber-600 border-b-2 border-amber-600">Clientes</button>
            <button onclick="mudarAba('entregadores')" id="btn-entregadores" class="py-3 font-medium text-slate-500">Entregadores</button>
            <button onclick="mudarAba('veiculos')" id="btn-veiculos" class="py-3 font-medium text-slate-500">Veículos</button>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6 max-w-4xl">
        <!-- SEÇÃO CLIENTES -->
        <section id="aba-clientes" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h2 class="text-lg font-semibold mb-4">Novo Cliente</h2>
                <form id="form-cliente" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="c-nome" placeholder="Nome" required class="w-full px-3 py-2 border rounded-lg">
                    <input type="text" id="c-tel" placeholder="Telefone" required class="w-full px-3 py-2 border rounded-lg">
                    <input type="text" id="c-end" placeholder="Endereço" required class="md:col-span-2 w-full px-3 py-2 border rounded-lg">
                    <button type="submit" class="bg-amber-600 text-white px-5 py-2 rounded-lg">Salvar Cliente</button>
                </form>
            </div>
            <table class="w-full bg-white rounded-xl shadow-sm border text-sm text-left">
                <thead class="border-b text-slate-500"><tr><th class="p-3">Nome</th><th class="p-3">Telefone</th><th class="p-3">Endereço</th></tr></thead>
                <tbody id="tabela-clientes"></tbody>
            </table>
        </section>

        <!-- SEÇÃO ENTREGADORES -->
        <section id="aba-entregadores" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h2 class="text-lg font-semibold mb-4">Novo Entregador</h2>
                <form id="form-entregador" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="e-nome" placeholder="Nome" required class="w-full px-3 py-2 border rounded-lg">
                    <input type="text" id="e-tel" placeholder="Telefone" required class="w-full px-3 py-2 border rounded-lg">
                    <button type="submit" class="bg-amber-600 text-white px-5 py-2 rounded-lg">Salvar Entregador</button>
                </form>
            </div>
            <table class="w-full bg-white rounded-xl shadow-sm border text-sm text-left">
                <thead class="border-b text-slate-500"><tr><th class="p-3">Nome</th><th class="p-3">Telefone</th></tr></thead>
                <tbody id="tabela-entregadores"></tbody>
            </table>
        </section>

        <!-- SEÇÃO VEÍCULOS -->
        <section id="aba-veiculos" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h2 class="text-lg font-semibold mb-4">Novo Veículo</h2>
                <form id="form-veiculo" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="v-modelo" placeholder="Modelo" required class="w-full px-3 py-2 border rounded-lg">
                    <input type="text" id="v-placa" placeholder="Placa" required class="w-full px-3 py-2 border rounded-lg">
                    <button type="submit" class="bg-amber-600 text-white px-5 py-2 rounded-lg">Salvar Veículo</button>
                </form>
            </div>
            <table class="w-full bg-white rounded-xl shadow-sm border text-sm text-left">
                <thead class="border-b text-slate-500"><tr><th class="p-3">Modelo</th><th class="p-3">Placa</th></tr></thead>
                <tbody id="tabela-veiculos"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrwxhCxatKrqyJxzRdhX2t54D7_-xQM18",
            authDomain: "sistema-ovos-distribuicao.firebaseapp.com",
            projectId: "sistema-ovos-distribuicao",
            storageBucket: "sistema-ovos-distribuicao.firebasestorage.app",
            messagingSenderId: "243415458017",
            appId: "1:243415458017:web:da9429e769a317f92097a0"
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        window.mudarAba = (aba) => {
            ['clientes', 'entregadores', 'veiculos'].forEach(a => {
                document.getElementById(`aba-${a}`).classList.toggle('hidden', a !== aba);
                document.getElementById(`btn-${a}`).className = (a === aba) ? "py-3 font-medium text-amber-600 border-b-2 border-amber-600" : "py-3 font-medium text-slate-500";
            });
        };

        // Função genérica de salvar
        const salvar = async (colecao, campos, formId) => {
            await addDoc(collection(db, colecao), { ...campos, criadoEm: new Date() });
            document.getElementById(formId).reset();
        };

        document.getElementById('form-cliente').onsubmit = (e) => { e.preventDefault(); salvar('clientes', { nome: document.getElementById('c-nome').value, telefone: document.getElementById('c-tel').value, endereco: document.getElementById('c-end').value }, 'form-cliente'); };
        document.getElementById('form-entregador').onsubmit = (e) => { e.preventDefault(); salvar('entregadores', { nome: document.getElementById('e-nome').value, telefone: document.getElementById('e-tel').value }, 'form-entregador'); };
        document.getElementById('form-veiculo').onsubmit = (e) => { e.preventDefault(); salvar('veiculos', { modelo: document.getElementById('v-modelo').value, placa: document.getElementById('v-placa').value }, 'form-veiculo'); };

        // Escutar tabelas
        const monitorar = (colecao, tabelaId, render) => {
            onSnapshot(query(collection(db, colecao), orderBy("criadoEm", "desc")), (snap) => {
                const tab = document.getElementById(tabelaId);
                tab.innerHTML = "";
                snap.forEach(d => tab.innerHTML += render(d.data()));
            });
        };

        monitorar('clientes', 'tabela-clientes', (d) => `<tr><td class="p-3">${d.nome}</td><td class="p-3">${d.telefone}</td><td class="p-3">${d.endereco}</td></tr>`);
        monitorar('entregadores', 'tabela-entregadores', (d) => `<tr><td class="p-3">${d.nome}</td><td class="p-3">${d.telefone}</td></tr>`);
        monitorar('veiculos', 'tabela-veiculos', (d) => `<tr><td class="p-3">${d.modelo}</td><td class="p-3">${d.placa}</td></tr>`);
    </script>
</body>
</html>
